; InfoDisplay – Pi-Empfänger
; Wird bei der Installation nach /etc/infodisplay/config.ini kopiert
; (außerhalb des Web-Roots). Dort anpassen, danach:
;   sudo systemctl restart infodisplay

[bluetooth]
enabled = true
; RFCOMM-Kanal (1–30) – muss mit dem Windows-Sender übereinstimmen
channel = 22
; Leer = alle Bluetooth-Adapter
adapter_address =
; Nur diese Windows-PCs zulassen (Bluetooth-Adressen, kommagetrennt). Leer = jeder gekoppelte PC mit Token.
allowed_macs =
; Gemeinsamer geheimer Token – wird von install.sh automatisch erzeugt
token = CHANGE_ME

[security]
; Maximale Größe einer Nachricht in Bytes
max_line_bytes = 1048576
; Rate-Limit Bluetooth-Nachrichten
msg_rate_per_sec = 10
msg_burst = 40
max_violations = 20
; Sekunden bis zur Anmeldung / ohne Lebenszeichen
auth_timeout = 10
idle_timeout = 120
connect_attempts_per_min = 6
; Rate-Limit Webserver (pro IP)
http_rate_per_sec = 20
http_burst = 60
max_sse_clients = 5

[web]
; 127.0.0.1 = nur lokal (Kiosk). 0.0.0.0 = im Netzwerk sichtbar (nicht empfohlen)
host = 127.0.0.1
port = 8080
web_root = /opt/infodisplay/web

[ui]
; Sekunden klein neben der Uhrzeit anzeigen
show_seconds = true
; Ohne Verbindung zum PC: nur Uhr und Datum als Bildschirmschoner, wandern über den Bildschirm.
; Geschwindigkeit in Pixel pro Sekunde (5–500)
saver_speed = 40
; Hintergrund als dunkler Farbverlauf passend zum Cover der laufenden Musik (sonst schwarz)
cover_background = true
; Querformat – was groß angezeigt wird: calendar = Termine groß, Schlagzeilen klein als Leiste unten
;                          news     = Schlagzeilen groß (mit Text), nächster Termin klein als Leiste unten
; Fehlt der Inhalt für den großen Bereich (keine Termine bzw. keine Schlagzeilen), übernimmt der andere.
focus = calendar
; Schlagzeilen (vom PC, [news] in dessen config.ini):
; Leiste unten – Sekunden bis zur nächsten Schlagzeile
news_seconds = 12
; Großansicht – Sekunden bis zum Weiterblättern, wenn nicht alle Schlagzeilen Platz haben
news_page_seconds = 30
; Anordnung: auto (Hoch-/Querformat nach Bildschirm) | landscape | portrait
;   Querformat: Musik links, Uhr/Wetter und Termine bzw. Schlagzeilen rechts
;   Hochformat: in Dritteln – oben Uhr/Wetter, Mitte Schlagzeilen (sonst Termine), unten Musik
layout = auto
; Drehung des HDMI-Bildschirms in Grad (0, 90, 180, 270) – für Hochformat 90 oder 270.
; Wird beim Start der Anzeige gesetzt (kiosk.sh); nach Änderung Dienst neu starten und Pi neu starten.
rotation = 0

[debug]
; > 0 aktiviert einen TCP-Testzugang mit demselben Protokoll (z. B. 5099). Im Betrieb auf 0 lassen!
tcp_test_port = 0
tcp_test_host = 127.0.0.1

[logging]
file = /var/log/infodisplay/infodisplay.log
; DEBUG, INFO, WARNING, ERROR
level = INFO
max_bytes = 2000000
backup_count = 5
