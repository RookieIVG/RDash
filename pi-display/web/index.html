<!doctype html>
<html lang="de" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>InfoDisplay</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body class="is-idle no-events">
  <!-- Hintergrund: schwarz oder Farbverlauf passend zum Cover (zwei Ebenen zum weichen Überblenden) -->
  <div id="bg" class="bg" aria-hidden="true"><div class="bg-layer"></div><div class="bg-layer"></div></div>

  <main class="layout">
    <section class="block block-media" aria-label="Aktuelle Wiedergabe">
      <div id="media-body" class="media" hidden>
        <div class="cover">
          <img id="cover-img" alt="Albumcover" decoding="async" hidden>
          <i id="cover-placeholder" class="bi bi-music-note-beamed cover-placeholder" aria-hidden="true"></i>
        </div>
        <div class="media-info">
          <p id="media-status" class="media-status"><i class="bi bi-play-fill" aria-hidden="true"></i><span id="media-status-text"></span></p>
          <p id="media-title" class="media-title"></p>
          <p id="media-artist" class="media-artist"></p>
          <p id="media-album" class="media-album"></p>
          <div id="media-progress" class="progress-wrap">
            <div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuemin="0" aria-valuemax="100">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div class="progress-times"><span id="time-pos">0:00</span><span id="time-dur">0:00</span></div>
          </div>
        </div>
      </div>
      <p id="media-empty" class="empty">Keine Verbindung zum PC</p>
    </section>

    <div class="side">
      <section class="block block-clock" aria-label="Uhrzeit">
        <p id="clock-time" class="clock-time">--:--</p>
        <p id="clock-date" class="clock-date">&nbsp;</p>
        <div id="weather" class="weather" hidden>
          <img id="weather-icon" class="weather-icon" alt="">
          <span id="weather-temp" class="weather-temp"></span>
          <span id="weather-text" class="weather-text"></span>
        </div>
      </section>

      <section id="calendar" class="block block-calendar" aria-label="Termine" hidden>
        <ul id="calendar-list" class="events"></ul>
      </section>

      <section id="headlines" class="block block-headlines" aria-label="Schlagzeilen" hidden>
        <ul id="headlines-list" class="headlines"></ul>
      </section>
    </div>

    <section id="news" class="block block-news" aria-label="Schlagzeile" hidden>
      <p class="news-line"><span id="news-source" class="news-source"></span><span id="news-title" class="news-title"></span></p>
    </section>

    <section id="next-event" class="block block-news" aria-label="Nächster Termin" hidden>
      <p class="news-line is-visible">
        <span id="next-when" class="news-source"></span>
        <span class="news-title"><span id="next-subject" class="next-subject"></span><span id="next-location" class="next-location"></span></span>
        <span id="next-more" class="next-more"></span>
      </p>
    </section>
  </main>

  <!-- Bildschirmschoner: ohne Verbindung zum PC nur Uhr und Datum, langsam über den Bildschirm wandernd -->
  <div id="saver" class="saver" aria-label="Uhrzeit">
    <div id="saver-box" class="saver-box">
      <p id="saver-time" class="saver-time">--:--</p>
      <p id="saver-date" class="saver-date">&nbsp;</p>
    </div>
  </div>
</body>
</html>
