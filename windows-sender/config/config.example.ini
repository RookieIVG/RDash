; InfoDisplay – Windows-Sender
; Diese Datei wird nach %APPDATA%\InfoDisplay\config.ini kopiert
; (außerhalb des Programmordners). Dort anpassen, nicht hier.

[link]
; bluetooth = normaler Betrieb, tcp = nur zum Testen im Netzwerk
transport = bluetooth
; Bluetooth-Adresse des Raspberry Pi (auf dem Pi: bluetoothctl show)
pi_mac = AA:BB:CC:DD:EE:FF
; RFCOMM-Kanal – muss mit [bluetooth] channel auf dem Pi übereinstimmen
channel = 22
; Nur für transport = tcp
tcp_host = 127.0.0.1
tcp_port = 5099
; Gemeinsamer geheimer Token – steht nach der Installation in /etc/infodisplay/config.ini auf dem Pi
token = CHANGE_ME
connect_timeout = 15
heartbeat_seconds = 20

[media]
enabled = true
; Abfrageintervall in Sekunden
poll_interval = 1.0
; Position während der Wiedergabe spätestens alle x Sekunden neu senden
resend_interval = 10
; Optional: nur diese Apps berücksichtigen (Teil der App-ID, kommagetrennt), z. B. spotify, msedge
preferred_apps =
send_cover = true
; Maximale Kantenlänge des Covers in Pixel
cover_max_px = 400
; Maximale Dateigröße des Covers in KB – kleiner = schnellerer Liedwechsel über Bluetooth
cover_max_kb = 40

[calendar]
; Benötigt Outlook (Classic). Das „neue Outlook“ hat keine COM-Schnittstelle.
enabled = true
; true = Outlook bei Bedarf starten, false = nur lesen, wenn Outlook läuft
start_outlook = false
refresh_minutes = 5
; 0 = nur heute, 1 = heute + morgen, ...
days_ahead = 1
max_events = 10
; Datenschutz: true = Betreff/Ort ausblenden, nur „Termin“ anzeigen
hide_subjects = false
; Als privat markierte Termine nur als „Privater Termin“ anzeigen
hide_private = true
; Datumsformat für den Outlook-Filter (Systemsprache Deutsch/Österreich)
restrict_date_format = %d.%m.%Y %H:%M

[weather]
; Wetter von Open-Meteo (kostenlos, ohne Anmeldung) – der PC braucht dafür Internet, der Pi nicht
enabled = false
; Angezeigter Ortsname und Koordinaten (z. B. aus Google Maps: Rechtsklick auf den Ort)
place = Graz
latitude = 47.07
longitude = 15.44
refresh_minutes = 15

[news]
; Schlagzeilen aus RSS-/Atom-Feeds (nur die Überschriften)
enabled = false
; Feed-Adressen, kommagetrennt, z. B.
;   https://rss.orf.at/news.xml, https://steiermark.orf.at/rss, https://www.derstandard.at/rss
feeds = https://rss.orf.at/news.xml
; Anzahl Schlagzeilen insgesamt (abwechselnd aus allen Feeds)
max_headlines = 10
; Kurztext (Beschreibung) mitsenden – sichtbar, wenn am Pi [ui] focus = news (Schlagzeilen groß)
with_text = true
refresh_minutes = 15

[attendance]
; Anwesenheit ausgewählter Personen aus der SAP-Zeiterfassung (OData) – Anzeige mit farbiger Markierung:
; grün = anwesend, blau = Telearbeit, grau = nicht anwesend, orange = ganztägig abwesend.
; Bitte nur mit Einverständnis der angezeigten Personen verwenden (Monitor ist für andere sichtbar).
enabled = false
service_url = https://fiori.kages.at:44310/sap/opu/odata/sap/ZKAG_HCM_ATTENDANCE_SRV
; Personalnummern (Pernr), kommagetrennt, in der gewünschten Reihenfolge (max. 10)
persons = 00123456, 00234567, 00345678
; Anmeldung: cert = Benutzerzertifikat aus Windows (wie im Browser) | sso | basic | none
auth = cert
; Teil des Zertifikat-Inhabers, z. B. der eigene Name – anzeigen mit PowerShell:
;   Get-ChildItem Cert:\CurrentUser\My | Format-List Subject, Issuer, NotAfter
cert = Mustermann
; Nur bei auth = basic
user =
password =
; Nur falls nötig (SAP-Mandant)
sap_client =
; Name: vorname_nachname ("Max Mustermann") | vorname ("Max") | sap ("Mustermann Max")
name_format = vorname_nachname
refresh_minutes = 2

[attendance_names]
; Optional: eigener Anzeigename je Personalnummer
; 00123456 = Max

[attendance_status]
; Optional: eigene Zuordnung "Teil des SAP-Statustexts = Kategorie" (anwesend, telearbeit, nicht_anwesend, ganztaegig).
; Standard: "Telearbeit" -> telearbeit, "ganzt. abw." -> ganztaegig, "nicht anwesend" -> nicht_anwesend.
; dienstreise = ganztaegig

[internet]
; Leer = Proxy aus den Windows-Einstellungen. Sonst z. B. http://proxy.firma.at:8080
proxy =
; Zeitlimit pro Abruf in Sekunden
timeout = 15
; Zertifikate werden immer geprüft (Kette + Servername). true = zusätzlich die strenge Prüfung von Python 3.13;
; die scheitert an Firmen-Firewalls mit TLS-Inspection ("Missing Authority Key Identifier") – dann false lassen.
strict_tls = false

[logging]
file = %LOCALAPPDATA%\InfoDisplay\logs\sender.log
; DEBUG, INFO, WARNING, ERROR
level = INFO
max_bytes = 2000000
backup_count = 5
